[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkforge"
version = "0.1.0"
description = "Automation toolkit for weekly newspaper layout"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "fastapi>=0.110",
    "httpx>=0.27",
]
launcher = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
inkforge-check = "inkforge.content_checker.cli:main"
inkforge-plan = "inkforge.layout_engine.cli:main"
inkforge-launcher = "inkforge.launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inkforge.launcher" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
