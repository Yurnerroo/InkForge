notes: >
  CMYK-профіль друку (ISOnewspaper26v4) — стандартний Adobe-пресет
  PDF/X-1a:2001, без кастомного `.joboptions`; підтверджено верстальницею
  як спільний для всіх трьох газет цієї друкарні (див. однакове поле в
  `mif.yaml` і `dyhovnist.yaml`).

  zag_1 має характерний колір заливки CMYK C=100 M=90 Y=10 K=0. У
  CharacterStyle є автозгенеровані "Стиль символа 1/2" — слід імпорту з
  Microsoft Word (Word -> копіювання в InDesign).

  Шрифт заголовка (Comfortaa Bold / EB Garamond Bold) підтверджено
  верстальницею: правило — **чергування між статтями на одній сторінці**
  (сусідні статті отримують різний з двох шрифтів), а НЕ вибір за
  кількістю слів у заголовку (початкове припущення в requirements.md
  було хибним, виправлено). Ще не реалізовано в коді/схемі — потребує
  окремого поля профілю (наприклад, `headline_font_alternation`) і логіки
  в Рівні 2, яка враховує порядок статей на сторінці (той самий порядок,
  що вже обчислюється в геометричному груповуванні, див.
  `docs/architecture.md`).
