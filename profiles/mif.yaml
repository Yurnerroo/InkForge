# Сторінка 1 -- підтверджено верстальницею 2 правила (не геометричне
# кластерування, як сторінки 2-7, а фіксовані IDML Self ID, знайдені й
# перевірені на стабільність в issue07/08/09):
#   1. Найдовша за обсягом тексту стаття на сторінці — головна стаття;
#      до неї ЗАВЖДИ йде велике фото зліва (main_photo_frame_id).
#   2. Стаття "прогноз магнітних бур" (визначається за ключовим словом
#      storm_forecast_keyword у заголовку/тілі) іде у фіксований фрейм
#      праворуч, що вже має власний кольоровий фон у шаблоні (магента
#      20% тінт) -- скрипту не треба самому додавати колір.
# "Народні прикмети" (мали б іти під прогнозом, якщо лишається місце)
# свідомо НЕ автоматизовано: у жодному з 3 зразків цей блок не був
# фактично розміщений на сторінці (лежить поза межами сторінки, порожній
# заповнювач) -- верстальниця підтвердила, що це рідкісний випадок;
# лишається ручною вставкою, поки не з'явиться реальний зразок.
page1_layout:
  main_photo_frame_id: "351cb"
  main_headline_frame_id: "35223"
  main_body_frame_id: "39190"
  storm_forecast_frame_id: "40ba4"
  storm_forecast_keyword: "магнітн"

