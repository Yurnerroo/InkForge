notes: >
  CMYK-профіль друку (ISOnewspaper26v4) підтверджено як спільний для всіх
  трьох газет (одна друкарня, стандартний Adobe-пресет PDF/X-1a:2001 без
  кастомного `.joboptions`) — див. однакове уточнення в `ty_i_ya.yaml` і
  `dyhovnist.yaml`.

  Кілька назв стилів абзаців ("Pidzag", "TextOsnovn", "Vriz") збігаються з
  "Ти і Я" — ймовірно, верстальниця історично копіювала базові стилі між
  своїми шаблонами. Не покладатися на це як на гарантію: газета все одно має
  й власні унікальні стилі ("текст", "vrubka", "zag_smol", "ZAG"). Minion
  Pro/Myriad Pro/Kozuka Mincho Pro — типові дефолтні шрифти Adobe, присутні
  майже в кожному InDesign-документі; ймовірно не використовуються реально
  в дизайні (потребує підтвердження), решта substituted-шрифтів — реальний
  ризик.

  paragraph_style_roles підтверджено на основі частотного аналізу застосованого
  стилю першого абзацу в кожному TextFrame на сторінках 1-8 у всіх 3 зразках
  (issue 7, 8, 9) — див. `samples/frame_roles.py`. "Zag_small" вживається у
  двох різних значеннях (короткий цифровий бейдж номера сторінки, напр. "4",
  і текстова рубрика-кікер, напр. "треба знати") — той самий стиль абзацу,
  різна функція; розрізняти доведеться довжиною/вмістом тексту, а не назвою
  стилю. Обидва підвиди не є контентом зі Level 1 manifest (статичні елементи
  шаблону) — Рівень 2 їх не повинен підміняти. "NormalParagraphStyle"
  (дефолтний стиль InDesign) тут використовується для статичного тексту
  імпресуму/шапки, а НЕ для основного тексту статей (на відміну від
  "Духовність", де цей самий стиль — це основний текст статей; див.
  примітку в dyhovnist.yaml). Стабільність Self ID фреймів на сторінках 1-8
  дуже висока: 44/44, 21/21, 8/9, 14/14, 8/9, 12/15, 9/12, 17/24 (спільних
  ID / об'єднання) для issue07-09 відповідно — набагато стабільніше, ніж
  "Ти і Я".
