notes: >
  Кілька назв стилів абзаців ("Pidzag", "TextOsnovn", "Vriz") збігаються з
  "Ти і Я" — ймовірно, верстальниця історично копіювала базові стилі між
  своїми шаблонами. Не покладатися на це як на гарантію: газета все одно має
  й власні унікальні стилі ("текст", "vrubka", "zag_smol", "ZAG"). Роль
  кожного стилю (основний текст / заголовок / підзаголовок) не підтверджена
  верстальницею — позначено як TBD, щоб не вгадувати неправильно. Minion
  Pro/Myriad Pro/Kozuka Mincho Pro — типові дефолтні шрифти Adobe, присутні
  майже в кожному InDesign-документі; ймовірно не використовуються реально
  в дизайні (потребує підтвердження), решта substituted-шрифтів — реальний
  ризик.
