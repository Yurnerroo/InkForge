  винятком на кожному (імовірно портрет/значок). Розворот-обкладинка (стор.
  1) — мішаний. Патерн ідентичний на всіх 3 проаналізованих номерах (issue
  8, 9, 10) -> свідомий дизайн, не випадковість.

