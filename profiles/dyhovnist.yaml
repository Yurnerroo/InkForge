notes: >
  Непарна загальна кількість сторінок (9) — на відміну від "Ти і Я" (16) і
  МІФ (8), де перша й остання сторінки завжди одинарні розвороти. Тут
  одинарна лише стор. 1; стор. 9 входить у парний розворот 8-9 разом з
  автоматизованою стор. 8 -> статус стор. 9 (повністю ручна чи частково
  автоматизована) не підтверджено, позначено в manual_pages_uncertain.
  "Text_Zagalnuj", "Стандарт", "zagol_18" збігаються з МІФ — той самий
  патерн часткового перевикористання базових стилів між шаблонами
  верстальниці. Багато кириличних декоративних шрифтів (*C-суфікс) у
  статусі Substituted навіть на машині, де готувався зразок -> високий
  ризик підміни шрифту для цієї газети конкретно.

  paragraph_style_roles свідомо залишено "TBD": на відміну від МІФ, тут
  частотний аналіз застосованого стилю абзацу на сторінках 2-9 (issue10)
  показав, що 134 зі 148 текстових фреймів (>90%) використовують дефолтний
  "NormalParagraphStyle" — тобто верстальниця в цій газеті НЕ застосовує
  окремі іменовані стилі для заголовка/підзаголовка/тексту, і сам основний
  текст статей теж під тим самим дефолтним стилем. Іменовані стилі
  ("Zagolovok++", "Text_Zagalnuj") зустрілися майже виключно на стор. 1
  (ручна, рекламно-передплатні блоки), не на контентних сторінках. Отже,
  заголовок/тіло статті тут, найімовірніше, розрізняються локальним
  форматуванням символів (розмір шрифту/жирність напряму на символах), а не
  назвою стилю абзацу — це вимагає окремого аналізу на рівні
  CharacterStyleRange/локальних override, якого ще не зроблено. Мапу за
  Self ID теж не варто вважати надійною: стабільність фреймів на
  сторінках 2-9 нижча й нерівномірніша, ніж у МІФ (напр. 7/13, 8/17, 8/14
  спільних/об'єднаних на різних сторінках) — ближче до "змінних" розворотів
  "Ти і Я", де кількість фреймів зростає з часом.
